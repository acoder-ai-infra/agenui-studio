name: agenui-studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        go-version: ["1.26.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Harness
        working-directory: harness
        run: go build ./...
      - name: Test Harness
        working-directory: harness
        run: |
          go test ./...
          go vet ./...
      - name: Build AGenUI Agent
        working-directory: agenui-agent
        run: go build ./...
      - name: Test AGenUI Agent
        working-directory: agenui-agent
        run: |
          go test ./...
          go vet ./...
      - name: Test Runtime
        run: |
          go test ./...
          go vet ./...
      # TODO(release): regenerate committed npm lockfiles against the public
      # npm registry before the first public release.
      - name: Test and build renderer
        working-directory: packages/renderer
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and build management console
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
