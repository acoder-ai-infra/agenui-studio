schema_version: harness.capability-catalog.v1
enabled:
  - agenui-knowrag
definitions:
  - id: agenui-knowrag
    version: 1.0.0
    scope: system
    type: streamable-http
    url: http://127.0.0.1:18082/mcp
    allowed_agents:
      - agenui_style
      - agenui_binder
    max_concurrent_calls: 8
    max_result_bytes: 4194304
    tools:
      - name: list_developer_operators
        description: List published operators available to data binding.
        input_schema:
          type: object
          properties:
            page_no: {type: integer, minimum: 1, maximum: 5, default: 1}
            page_size: {type: integer, minimum: 1, maximum: 100, default: 100}
          additionalProperties: false
      - name: search_developer_apis
        description: Search data sources for the current binding requirements.
        input_schema:
          type: object
          required: [query]
          properties:
            query: {type: string, minLength: 1}
            top_k: {type: integer, minimum: 1, maximum: 3, default: 1}
          additionalProperties: false
