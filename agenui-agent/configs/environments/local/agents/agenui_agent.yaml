agent_id: agenui_agent
agent_type: agenui_agent
version: 1.0.0
status: enabled
name: AGenUI 编排 Agent
description: 协调规则驱动的界面生成、算子选择与数据绑定。
process_presentation:
    stage:
        id: content_contract
        label: 理解内容要求
        order: 10
runtime:
    type: eino
    mode: deep_agent
    timeout_ms: 900000
    max_turns: 24
    checkpoint: true
    stream: true
prompt:
    prompt_ref: prompt://agenui/root
    prompt_version: 1.11.0
model:
    max_tokens: 32768
    reasoning_mode: disabled
tools:
    - name: ask_user
      version: 1.0.1
    - name: agenui_submit_content_contract
      version: 1.0.0
    - name: agenui_resolve_design_edit
      version: 2.2.0
    - name: agenui_submit_edit_contract
      version: 2.1.0
    - name: agenui_prepare_binding_edit
      version: 1.0.0
    - name: agenui_publish_next_steps
      version: 1.3.0
orchestration:
    default_mode: deep_agent
    sub_agents:
        - agenui_style
        - agenui_binder
protocol_policy:
    streaming: true
    output_format: markdown
extensions:
    before_model_hooks:
    tool_call_interceptors:
        - agenui.task_interceptor.v1
